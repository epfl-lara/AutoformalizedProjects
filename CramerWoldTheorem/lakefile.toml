name = "CramerWoldTheorem"
version = "0.1.0"
keywords = ["math", "formalization", "probability", "measure-theory"]
defaultTargets = ["CramerWoldTheorem"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[require]]
name = "Physlib"
git = "https://github.com/leanprover-community/physlib.git"
rev = "eb547a5c5d0c8dd9500d40f2a3fdc18ed5aa079d"

[[lean_lib]]
name = "CramerWoldTheorem"

[[lean_lib]]
name = "OddInversion"

[[require]]
name = "repl"
git = "https://github.com/leanprover-community/repl"
rev = "v4.31.0"
