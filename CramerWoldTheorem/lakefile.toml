name = "CramerWoldTheorem"
version = "0.1.0"
keywords = ["math", "formalization", "probability", "measure-theory"]
defaultTargets = ["CramerWoldTheorem"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.1"

[[require]]
name = "Physlib"
git = "https://github.com/HEPLean/PhysLean.git"
rev = "f2cc2764e1d6629003438f3ea939c6d94de379f5"

[[lean_lib]]
name = "CramerWoldTheorem"

[[lean_lib]]
name = "OddInversion"

[[require]]
name = "repl"
git = "https://github.com/leanprover-community/repl"
rev = "v4.29.0"
