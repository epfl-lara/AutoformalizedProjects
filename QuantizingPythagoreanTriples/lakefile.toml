name = "QuantizingPythagoreanTriples"
version = "0.1.0"
keywords = ["math", "formalization"]
defaultTargets = ["Pythagore2"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0-rc2"

[[lean_lib]]
name = "Pythagore2"

[[require]]
name = "repl"
git = "https://github.com/leanprover-community/repl"
rev = "v4.30.0-rc2"
