name = "lean_imo_bench_gpt6_astra"
version = "0.1.0"
defaultTargets = ["LeanIMOBench"]

# No [leanOptions] block on purpose. The benchmark statements were authored and
# verified upstream as standalone `import Mathlib` files under default
# elaboration options; overriding autoImplicit or the linter set could change
# how a statement elaborates and would weaken the claim that these are proofs of
# the published statements.

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

# The 18 benchmark theorems. Each imports its own helper lemmas.
[[lean_lib]]
name = "LeanIMOBench"
globs = ["LeanIMOBench.+"]

# Helper lemmas produced during proof search, one module per lemma.
[[lean_lib]]
name = "LeanFlowProofs"
globs = ["LeanFlowProofs.+"]
